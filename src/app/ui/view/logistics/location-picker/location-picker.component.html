<app-modal>
  <div class="lp-modal">
    <div class="lp-header">
      <h3 class="lp-title">{{ title }}</h3>
      <button type="button" class="lp-close" (click)="cancel()" aria-label="Close">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round">
          <path d="M18 6 6 18M6 6l12 12"></path>
        </svg>
      </button>
    </div>

    <p class="lp-hint">Type an address to search, or tap/drag the pin on the map to set the exact spot.</p>

    <!-- Autocomplete search -->
    <div class="lp-search-wrap">
      <svg class="lp-search-icon" width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <circle cx="11" cy="11" r="7"></circle>
        <path d="m21 21-4.3-4.3"></path>
      </svg>
      <input
        type="text"
        class="lp-search-input"
        placeholder="Search for an address..."
        [ngModel]="searchTerm"
        (ngModelChange)="onSearchInput($event)"
      />
    </div>

    <div *ngIf="suggestions.length" class="lp-suggestions">
      <button type="button" *ngFor="let s of suggestions" class="lp-suggestion" (click)="pickSuggestion(s)">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#9aa7ae" stroke-width="2" class="shrink-0">
          <path d="M12 21s-7-6.5-7-11a7 7 0 0 1 14 0c0 4.5-7 11-7 11z"></path>
          <circle cx="12" cy="10" r="2.5"></circle>
        </svg>
        <span class="truncate">{{ s.label }}</span>
      </button>
    </div>
    <p *ngIf="isSearching" class="lp-searching">Searching…</p>

    <!-- Map -->
    <div class="lp-map-wrap">
      <div #mapEl class="lp-map-canvas"></div>
      <div *ngIf="mapLoadFailed" class="lp-map-fallback">
        <p class="text-[12.5px] text-[#9aa7ae] text-center px-4">Map preview couldn't load — you can still search and confirm an address above.</p>
      </div>
    </div>

    <div *ngIf="selectedPoint" class="lp-selected">
      <p class="text-[11px] font-semibold text-[#9aa7ae] uppercase tracking-wide mb-0.5">Selected Location</p>
      <p class="text-[13px] font-medium text-[#14181b]">{{ selectedPoint.label }}</p>
    </div>

    <div class="lp-actions">
      <button type="button" class="lp-btn lp-btn-outline" (click)="cancel()">Cancel</button>
      <button type="button" class="lp-btn lp-btn-primary" [disabled]="!selectedPoint" (click)="confirm()">Confirm Location</button>
    </div>
  </div>
</app-modal>
